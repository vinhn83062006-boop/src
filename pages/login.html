<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg,#788086,#6e7374);
      font-family: Arial, sans-serif;
    }
    .box {
      width: 320px;
      padding: 30px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,.2);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #2196f3;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #1e88e5;
    }
    p {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Đăng nhập</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Mật khẩu">

  <button onclick="login()">Đăng nhập</button>

  <p>Chưa có tài khoản? <a href="./register.html">Đăng ký</a></p>
</div>

<script>
function login() {
  fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.token) {
      localStorage.setItem("token", data.token);
      location.href = "./dashboard.html";
    } else {
      alert(data.message);
    }
  });
}
</script>

</body>
</html>
