<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Đơn hàng</h2>
<ul id="orders"></ul>

<script>
fetch("/api/orders", {
  headers: {
    Authorization: "Bearer " + localStorage.getItem("token")
  }
})
.then(res => res.json())
.then(data => {
  const ul = document.getElementById("orders");
  data.forEach(o => {
    const li = document.createElement("li");
    li.innerText = `
      User: ${o.user.email}
      | Tổng tiền: ${o.totalPrice}
      | Trạng thái: ${o.status}
    `;
    ul.appendChild(li);
  });
});
</script>

</body>
</html>
