<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>User Order</title>
</head>
<body>
  <h2>Đơn hàng của tôi</h2>

  <input id="price" placeholder="Total price">
  <button onclick="createOrder()">Tạo đơn</button>

  <ul id="orders"></ul>

  <script>
    const token = localStorage.getItem("token");
    if (!token) location.href = "login.html";

    async function createOrder() {
      await fetch("http://localhost:3000/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ totalPrice: price.value })
      });
      loadOrders();
    }

    async function loadOrders() {
      const res = await fetch("http://localhost:3000/api/orders/my-orders", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      const data = await res.json();
      orders.innerHTML = data.map(o =>
        `<li>${o.totalPrice} - ${o.status}</li>`
      ).join("");
    }

    loadOrders();
  </script>
</body>
</html>
